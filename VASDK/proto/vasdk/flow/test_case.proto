// A scripted conversation checked against an agent, by text: vasdk_agentc test agent.txtpb case.txtpb
//   # proto-file: vasdk/flow/test_case.proto
//   # proto-message: vasdk.flow.FlowTestCase
syntax = "proto3";

package vasdk.flow;

import "google/protobuf/struct.proto";
import "vasdk/nlu/entity.proto";

message FlowTestCase {
  string name = 1;
  repeated TestTurn turns = 2;
  google.protobuf.Struct session = 3;   // session params set before the first turn
  google.protobuf.Struct context = 4;   // what $context.* reads
  repeated EntityValues entities = 5;   // dynamic entities' values for this conversation
}

message EntityValues {
  string name = 1;                      // the entity, without @
  repeated vasdk.nlu.EntityValue values = 2;
}

message TestTurn {
  string user = 1;   // what the user says; empty: the conversation starts (the start page's greeting)
  TurnExpectation expect = 2;
}

// Every field set must hold after the turn; unset fields aren't checked.
message TurnExpectation {
  string page = 1;
  string flow = 2;
  string said = 3;                     // the whole reply
  repeated string said_contains = 4;   // case-insensitive
  optional bool matched = 5;           // false: no route understood the turn
  optional bool expects_reply = 6;
  optional bool ends_session = 7;
  map<string, string> session = 8;     // session param name → its value as a reply would say it
  map<string, string> form = 9;        // form slot, or complete / confirmed / failed → its value ("" when empty)
  map<string, string> entities = 10;   // entity → the value found in this turn's words ($nlu.entities.<name>)
}

// A scripted conversation checked against an agent, by text: vasdk_agentc test agent.txtpb case.txtpb
//   # proto-file: vasdk/flow/test_case.proto
//   # proto-message: vasdk.flow.FlowTestCase
syntax = "proto3";

package vasdk.flow;

import "google/protobuf/struct.proto";
import "vasdk/flow/expectation.proto";
import "vasdk/flow/trigger.proto";
import "vasdk/nlu/entity.proto";

message FlowTestCase {
  string name = 1;
  repeated TestTurn turns = 2;
  google.protobuf.Struct session = 3;   // session params set before the first turn
  google.protobuf.Struct context = 4;   // what $context.* reads
  repeated EntityValues entities = 5;
  string start_time = 6;                // the clock at the first turn, local time: "2026-11-09T08:00:00"; unset: now   // dynamic entities' values for this conversation
}

message EntityValues {
  string name = 1;                      // the entity, without @
  repeated vasdk.nlu.EntityValue values = 2;
}

message TestTurn {
  string user = 1;   // what the user says; empty: the conversation starts (the start page's greeting)
  TurnExpectation expect = 2;
  bool no_input = 3;  // the user says nothing (no-input), instead of `user`
  optional int32 choice = 4;   // the user taps the last reply's choice at this index, from 0, instead of `user`
  map<string, string> tool_results = 5;
  string fire_trigger = 6;                // the app fires this trigger (or app event), instead of `user`
  google.protobuf.Struct trigger_payload = 7;   // with this payload ($trigger.payload.*)
  int32 after_ms = 8;                     // the clock moves on this much before the turn   // tool name → the JSON it returns this turn, instead of calling it; {"error": "..."} fails
}

// Every field set must hold after the turn; unset fields aren't checked.
message TurnExpectation {
  string page = 1;
  string flow = 2;
  string said = 3;                     // the whole reply
  repeated string said_contains = 4;   // case-insensitive
  optional bool matched = 5;           // false: no route understood the turn
  optional bool expects_reply = 6;
  optional bool ends_session = 7;
  map<string, string> session = 8;     // session param name → its value as a reply would say it
  map<string, string> form = 9;        // form slot, or complete / confirmed / failed → its value ("" when empty)
  map<string, string> entities = 10;   // entity → the value found in this turn's words ($nlu.entities.<name>)
  string event = 11;                   // the event this turn raised: no-match, no-input or max-reprompts
  repeated string choices = 12;        // the labels of the choices offered, in order
  Expectation.Mode expect_mode = 13;   // what the reply expects the user to say
  Expectation.Keyboard keyboard = 14;
  optional int32 follow_up_listen_ms = 15;
  repeated string tools_called = 16;
  TriggerDecision trigger_decision = 17;   // what became of fire_trigger   // the tools call_tool called this turn, in order   // how long the mic stays open after the reply, by the agent's settings
}

// Utterances and what they should be understood as, for `vasdk_agentc eval`: intent accuracy,
// and entity precision, recall and F1, without running conversations.
message NluEvalSet {
  repeated NluEvalCase cases = 1;
}

message NluEvalCase {
  string text = 1;
  string intent = 2;                 // empty: no intent should match
  map<string, string> entities = 3;  // entity name (without @) → its value
  bool mid_chat = 4;                 // said mid-chat with the LLM: judged as the agent does then (rules, most of the words)
}

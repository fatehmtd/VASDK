// A scripted conversation checked against an agent, by text: vasdk_agentc test agent.txtpb case.txtpb
//   # proto-file: vasdk/flow/test_case.proto
//   # proto-message: vasdk.flow.FlowTestCase
syntax = "proto3";

package vasdk.flow;

message FlowTestCase {
  string name = 1;
  repeated TestTurn turns = 2;
}

message TestTurn {
  string user = 1;   // what the user says; empty: the conversation starts (the start page's greeting)
  TurnExpectation expect = 2;
}

// Every field set must hold after the turn; unset fields aren't checked.
message TurnExpectation {
  string page = 1;
  string flow = 2;
  string said = 3;                     // the whole reply
  repeated string said_contains = 4;   // case-insensitive
  optional bool matched = 5;           // false: no route understood the turn
  optional bool expects_reply = 6;
  optional bool ends_session = 7;
}

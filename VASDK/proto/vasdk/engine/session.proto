// What an app gives a spoken session it creates through the C API (vasdk_session_create_message,
// Python's Session): its options, and the tools its LLM may call. Fields are only ever added.
syntax = "proto3";

package vasdk.engine;

message SessionOptions {
  string id = 1;                  // Event.session_id
  string models_dir = 2;          // where the speech models are
  string system_prompt = 3;       // the LLM's instructions; {context} in them is the app's state
  string format_instruction = 4;  // how the LLM's replies are formatted, added to every request
}

// A tool the session's LLM may call, written by the app. Its arguments and result are JSON
// objects: the LLM writes them.
message ToolDeclaration {
  string name = 1;
  string description = 2;
  repeated ToolParameter parameters = 3;
}

message ToolParameter {
  string name = 1;
  string description = 2;
  string type = 3;                // "string" (the default), "number", "integer" or "boolean"
  optional bool required = 4;     // unset: true
}

// What a running engine reports to its listeners; see docs/reference/engine.md.
// Fields are only ever added, so listeners built against an older schema keep working.
syntax = "proto3";

package vasdk.engine;

message Event {
  int64 timestamp_ms = 1;   // milliseconds since the Unix epoch
  oneof kind {
    Transcript transcript = 10;
    AgentReply agent_reply = 11;
    AgentStateChange agent_state = 12;
    ToolCall tool_call = 13;
    Error error = 15;
  }
}

// What the user said (or sent with injectUserText).
message Transcript {
  string text = 1;
  bool is_final = 2;          // false: a partial result that later ones replace
  float confidence = 3;
  bool is_backchannel = 4;    // "mm-hmm" while the assistant spoke: recorded, never answered
}

// What the assistant says. Sent once per streamed piece; `text` is the whole reply so far.
message AgentReply {
  string text = 1;
  bool is_final = 2;          // the reply is complete
  bool expects_reply = 3;     // set on the final piece: the assistant asked the user something
  repeated string choices = 4;  // set on the final piece: answers a UI can offer as buttons
}

// The assistant's conversation state: IDLE, LISTENING, THINKING, SPEAKING or INTERRUPTED.
message AgentStateChange {
  string state = 1;
  string previous_state = 2;
  string transition = 3;      // why, e.g. USER_STOPPED_SPEAKING, BARGE_IN_INTERRUPT
}

// A tool the LLM called, reported when the tool returns.
message ToolCall {
  string name = 1;
  string arguments_json = 2;
  string result_json = 3;     // {"error": ...} when the tool failed or is unknown
}

message Error {
  enum Severity {
    SEVERITY_ERROR = 0;       // prefixed: a bare ERROR collides with a Windows macro
    SEVERITY_WARNING = 1;
    SEVERITY_FATAL = 2;
  }
  Severity severity = 1;
  string source = 2;          // the processor or component that failed, e.g. "LLM"
  string message = 3;
  int32 code = 4;
}

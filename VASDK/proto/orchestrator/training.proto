// RequestFlow NLU training-data schema - transcribed from docs/reference/requestflow-spec.md §22
// (Draft v2.9's unified {{name:type}} phrase-grammar capture syntax). Field names/numbers/comments
// are kept identical to the spec's own proto block, same convention as domain.proto. Milestone 1.3
// (docs/reference/requestflow-roadmap.md §3) - the phrase-grammar compiler consuming this schema.
syntax = "proto3";
package va.orchestrator;

import "google/protobuf/struct.proto";

message TrainingSet {
  repeated IntentTrainingData intents = 1;
  EntityDictionary entities = 2;   // predefined placeholders resolve against this - see spec §22.1
}

message IntentTrainingData {
  string intent_name = 1;       // must match some Route's IntentTrigger.intent_name
  repeated string phrases = 2;  // pattern strings - see spec §22.1; a leading "!" marks a negative example
  repeated CaptureDefault capture_defaults = 3;   // optional per-capture-name fallback - see spec §26
}

// spec §26 (Draft v2.7) - used whenever this intent matches but `name` (a {{name:type}}
// capture from §22.1) wasn't present in NLUResult.extracted_parameters.
message CaptureDefault {
  string name = 1;
  google.protobuf.Value default_value = 2;
}

// A curated, reusable vocabulary - the "predefined placeholder" side of spec §22.1.
message EntityDictionary {
  repeated EntityGroup groups = 1;
}

message EntityGroup {
  string name = 1;              // e.g. "zone" - referenced as {{param_name:zone}}
  repeated EntityValue values = 2;
}

message EntityValue {
  string canonical = 1;         // e.g. "front_left" - referenced bare as {front_left} when unique across the whole dictionary
  repeated string synonyms = 2; // "front left", "driver's side front", "front-left vent"
}

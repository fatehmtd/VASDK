# Every pull request and every push to master: build and test on each desktop platform, check that
# the C library exports the C API only, and build VASDK as another project's subproject.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}   # Phonon's gated checkpoint; without it its tests skip

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-14 }
          - { name: windows-x64, os: windows-2022 }
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: python -m pip install --upgrade protobuf
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ci-${{ matrix.name }}
      - name: Models cache
        uses: actions/cache@v4
        with:
          path: build/ci/VASDK_3P_IMPL/models
          key: models-${{ matrix.name }}-${{ hashFiles('VASDK_3P_IMPL/cmake/Download*.cmake') }}
          restore-keys: models-${{ matrix.name }}-

      - name: Configure
        run: >
          cmake --preset ci -G Ninja
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DPython3_EXECUTABLE=${{ env.pythonLocation }}/${{ runner.os == 'Windows' && 'python.exe' || 'bin/python' }}
      - name: Build
        run: cmake --build --preset ci
      - name: Test
        run: ctest --preset ci

      - name: The C library exports vasdk_* only
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   symbols=$(nm -D --defined-only build/ci/cmake/c_library/libvasdk_c.so | awk '{print $3}') ;;
            macOS)   symbols=$(nm -gU build/ci/cmake/c_library/libvasdk_c.dylib | awk '{print $3}' | sed 's/^_//') ;;
            Windows) symbols=$(dumpbin //exports build/ci/cmake/c_library/vasdk_c.dll | awk '/^ +[0-9]+ +[0-9A-F]+ +[0-9A-F]+ /{print $4}') ;;
          esac
          others=$(echo "$symbols" | grep -v '^vasdk_' | grep -v '^$' || true)
          echo "$(echo "$symbols" | grep -c '^vasdk_') vasdk_* functions exported"
          if [ -n "$others" ]; then echo "Exported beyond the C API:"; echo "$others" | head -50; exit 1; fi

  subproject:
    name: as a subproject (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-24.04 }
          - { name: windows-x64, os: windows-2022 }
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: subproject-${{ matrix.name }}
      - name: Configure another project that fetches VASDK
        run: >
          cmake -S tests/consumer/subproject -B build/subproject -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DFETCHCONTENT_SOURCE_DIR_VASDK=${{ github.workspace }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build build/subproject
      - name: Run
        run: ctest --test-dir build/subproject --output-on-failure

  checks:
    name: docs, skills, versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 skills/check_skills.py
      - run: python3 VASDK_3P_IMPL/check_rules.py
      - run: python3 cmake/check_versions.py
      - run: python3 skills/vasdk-binding-parity/check_parity.py --bindings c,python,kotlin

# Releases VASDK, only when started by hand (docs/releasing.md): Actions > Release > Run workflow, on
# master. Nothing runs on a merge. The version comes from the commits since the last release
# (cmake/next_version.py: breaking -> major, feat -> minor, else patch). Each platform and flavor
# builds the C library as an archive of an install prefix. With "publish" ticked, and every archive
# but the full flavor's built, it commits the version to master, tags v<version> and puts the
# archives, SHA256SUMS, an SBOM and build provenance on a GitHub release. Unticked, it's a dry run:
# the archives stay on the run as artifacts. The package channels are built from the release.
name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish: commit the version, tag it and create the GitHub release (unticked: a dry run)"
        type: boolean
        default: false
      bump:
        description: "Version bump: auto (from the commits), or forced"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # the tags and the commits since the last release
      - name: A release is from master
        if: inputs.publish
        run: |
          [ "$GITHUB_REF" = refs/heads/master ] || { echo "::error::publish from master, not $GITHUB_REF"; exit 1; }
      - id: version
        run: |
          version=$(python3 cmake/next_version.py --bump "${{ inputs.bump }}")
          python3 cmake/check_versions.py --set "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  archive:
    name: ${{ matrix.name }} ${{ matrix.flavor }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        name: [linux-x64, linux-arm64, macos-arm64, macos-x64, windows-x64]
        flavor: [core, default, full]
        include:
          - { name: linux-x64,   os: ubuntu-24.04,     archive: tar.gz }
          - { name: linux-arm64, os: ubuntu-24.04-arm, archive: tar.gz }
          - { name: macos-arm64, os: macos-15,         archive: tar.gz }
          - { name: macos-x64,   os: macos-15-intel,   archive: tar.gz }
          - { name: windows-x64, os: windows-2022,     archive: zip }
    env:
      NAME: vasdk-${{ matrix.flavor }}-${{ needs.version.outputs.version }}-${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The version
        shell: bash
        run: python cmake/check_versions.py --set "${{ needs.version.outputs.version }}"
      - uses: lukka/get-cmake@latest
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        # curl from source (Schannel on Windows, the system's OpenSSL elsewhere); on Linux the
        # runner's glibc for now, a manylinux_2_28 container next (docs/releasing.md)
        shell: bash
        run: |
          preset=release; [ "${{ matrix.flavor }}" != default ] && preset=release-${{ matrix.flavor }}
          echo "PRESET=$preset" >> "$GITHUB_ENV"
          cmake --preset $preset -G Ninja -DVASDK_FETCH_CURL=ON
      - name: Build and install
        shell: bash
        run: |
          cmake --build --preset "$PRESET"
          cmake --install "build/$PRESET" --prefix "stage/$NAME"
      - name: Archive
        shell: bash
        run: |
          cd stage
          if [ "${{ matrix.archive }}" = zip ]; then 7z a -tzip "../$NAME.zip" "$NAME"; else tar czf "../$NAME.tar.gz" "$NAME"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: [version, archive]
    # A dry run sums up whatever was built; a release needs every core and default archive
    if: always() && needs.version.result == 'success' && (needs.archive.result == 'success' || !inputs.publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # the version commit, the tag and the GitHub release
      id-token: write        # build provenance
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}   # the commit the archives were built from
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum vasdk-* > SHA256SUMS && cat SHA256SUMS
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/vasdk-${{ needs.version.outputs.version }}.cdx.json
          upload-artifact: false
      - name: Build provenance
        if: inputs.publish
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/vasdk-*
      - name: Commit the version and tag it
        if: inputs.publish
        run: |
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists"; exit 1
          fi
          python3 cmake/check_versions.py --set "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "chore: release $VERSION"
            # A fast-forward only: when master moved during the build, nothing is pushed
            git push origin HEAD:refs/heads/master || {
              echo "::error::master moved while the archives were built: run the release again"; exit 1; }
          fi
          git tag "$tag"
          git push origin "$tag"
      - name: GitHub release
        if: inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          files: |
            dist/vasdk-*
            dist/SHA256SUMS
          generate_release_notes: true

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "VasdkApp"
include ':app'
// The Kotlin binding as an AAR (bindings/kotlin's sources): ./gradlew -Pvasdk.kotlinBinding=true :vasdk:assembleRelease
if (providers.gradleProperty('vasdk.kotlinBinding').getOrElse('false') == 'true') {
    include ':vasdk'
}

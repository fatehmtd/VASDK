[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vasdk"
version = "1.1.0"
description = "VASDK voice agents from Python: agents, text conversations, and steps, tools, envelopes, page types and entity extractors written in Python"
readme = "README.md"
requires-python = ">=3.8"
# The messages are generated by protoc 29 (VASDK's build): its Python runtime or newer.
dependencies = ["protobuf>=5.29.5"]
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[tool.setuptools.packages.find]
include = ["vasdk", "vasdk.*"]   # vasdk.engine, vasdk.flow, ...: the messages bundle.py copies in

[tool.setuptools.package-data]
# The shared VASDK library and what it needs, copied in by bundle.py before the wheel is built.
vasdk = ["*.dll", "*.so", "*.so.*", "*.dylib"]
"vasdk.engine" = ["*.pyi"]
"vasdk.flow" = ["*.pyi"]
"vasdk.goal" = ["*.pyi"]
"vasdk.nlu" = ["*.pyi"]
"vasdk.providers" = ["*.pyi"]
